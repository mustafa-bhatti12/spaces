# Replaces `livekit-server --dev` once egress needs redis + webhook signing, which --dev's
# placeholder-key mode doesn't wire up (CLI flags alone can't set a webhook signing key).
port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  # Congestion control steps a struggling subscriber down through video layers and never throttles
  # audio. allow_pause stays off (the default): video is never paused outright on a weak link.
  congestion_control:
    enabled: true
redis:
  address: localhost:6379
keys:
  devkey: secret
# Every room, participant and egress event goes to token-service (on this host), signed with devkey's
# secret. It records each call once someone joins (participant_joined), moves a finished recording
# into place and transcribes it (egress_ended), and cleans up when a room closes (room_finished).
# start-all.sh swaps in the real key pair on a VPS; the URL stays localhost.
webhook:
  api_key: devkey
  urls:
    - http://localhost:8880/recording/webhook
log_level: debug
