<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test Call</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #eee;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid #2a2a2a;
    }
    header h1 { font-size: 15px; font-weight: 600; margin: 0 0 12px; color: #888; }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .picker {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .rooms {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      min-height: 28px;
    }
    .rooms .hint { font-size: 12px; color: #666; }
    .room-chip {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12px;
      color: #cde;
      cursor: pointer;
    }
    .room-chip:hover { border-color: #2f7cf6; }
    .room-chip.active { border-color: #2f7cf6; color: #fff; }
    input {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 6px;
      color: #eee;
      padding: 8px 10px;
      font-size: 14px;
    }
    button {
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #join { background: #2f7cf6; color: #fff; }
    #leave { background: #3a1f1f; color: #ff8080; }
    #generate { background: #232323; color: #cde; }
    #join:disabled, #leave:disabled { opacity: 0.4; cursor: default; }
    #status { font-size: 13px; color: #888; }
    #status.error { color: #ff8080; }
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 12px;
      padding: 20px;
    }
    .tile {
      background: #1a1a1a;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tile video, .tile audio { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile .waiting { font-size: 12px; color: #555; }
    .tile .label {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.6);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Test Call — throwaway LiveKit smoke test, not Petition Studio</h1>
    <div class="row">
      <input id="name" placeholder="Your name" />
      <input id="room" placeholder="Room name" value="two-laptop-test" />
      <button id="generate" type="button">Generate new room</button>
      <button id="join">Join</button>
      <button id="leave" disabled>Leave</button>
      <span id="status">not connected</span>
    </div>
    <div class="picker">
      <div class="rooms" id="rooms"><span class="hint">Active rooms will show up here once someone joins one.</span></div>
    </div>
  </header>
  <div id="grid"></div>

  <script type="module">
    import { Room, RoomEvent } from 'https://unpkg.com/livekit-client@2.22.1/dist/livekit-client.esm.mjs';

    const nameInput = document.getElementById('name');
    const roomInput = document.getElementById('room');
    const joinBtn = document.getElementById('join');
    const leaveBtn = document.getElementById('leave');
    const generateBtn = document.getElementById('generate');
    const statusEl = document.getElementById('status');
    const grid = document.getElementById('grid');
    const roomsEl = document.getElementById('rooms');

    const ADJECTIVES = ['brave', 'calm', 'quick', 'warm', 'bright', 'quiet', 'bold', 'lucky'];
    const NOUNS = ['otter', 'falcon', 'maple', 'harbor', 'comet', 'canyon', 'tiger', 'meadow'];

    function randomRoomName() {
      const adjective = ADJECTIVES[Math.floor(Math.random() * ADJECTIVES.length)];
      const noun = NOUNS[Math.floor(Math.random() * NOUNS.length)];
      const suffix = Math.floor(Math.random() * 90 + 10);
      return `${adjective}-${noun}-${suffix}`;
    }

    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.classList.toggle('error', Boolean(isError));
    }

    function normalizeRoomName(raw) {
      return raw.trim().toLowerCase().replace(/\s+/g, '-');
    }

    let room;

    function tileId(participantIdentity) {
      return `tile-${participantIdentity.replace(/[^a-zA-Z0-9_-]/g, '_')}`;
    }

    function ensureTile(identity, label) {
      let tile = document.getElementById(tileId(identity));
      if (!tile) {
        tile = document.createElement('div');
        tile.className = 'tile';
        tile.id = tileId(identity);
        tile.innerHTML = `<span class="waiting">waiting for video…</span><div class="label">${label}</div>`;
        grid.appendChild(tile);
      }
      return tile;
    }

    function attachTrack(track, identity, label) {
      const tile = ensureTile(identity, label);
      tile.querySelector('.waiting')?.remove();
      const el = track.attach();
      tile.appendChild(el);
    }

    function removeParticipantTile(identity) {
      document.getElementById(tileId(identity))?.remove();
    }

    // --- Room picker: poll active rooms so a second person can click instead of typing exactly
    // what the first person typed (case, spacing, and typos otherwise split people into two rooms
    // that never see each other with no error at all). ---
    let roomsPollTimer;

    async function refreshRoomList() {
      try {
        const res = await fetch('/rooms');
        if (!res.ok) return;
        const rooms = await res.json();
        if (rooms.length === 0) {
          roomsEl.innerHTML = '<span class="hint">No active rooms yet — join one to start it.</span>';
          return;
        }
        roomsEl.innerHTML = '';
        for (const r of rooms) {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'room-chip';
          chip.textContent = `${r.name} (${r.numParticipants})`;
          if (normalizeRoomName(roomInput.value) === r.name) chip.classList.add('active');
          chip.addEventListener('click', () => {
            roomInput.value = r.name;
            refreshRoomList();
          });
          roomsEl.appendChild(chip);
        }
      } catch {
        // token-service unreachable — leave whatever was last rendered, join button still works
      }
    }

    function startRoomPolling() {
      refreshRoomList();
      roomsPollTimer = setInterval(refreshRoomList, 3000);
    }

    generateBtn.addEventListener('click', () => {
      roomInput.value = randomRoomName();
      refreshRoomList();
    });

    // --- Call flow ---
    async function join() {
      const name = nameInput.value.trim();
      const roomName = normalizeRoomName(roomInput.value);
      if (!name || !roomName) {
        setStatus('enter your name and a room name first', true);
        return;
      }
      roomInput.value = roomName;

      joinBtn.disabled = true;
      setStatus('requesting token...');

      let details;
      try {
        const res = await fetch(`/connect?room=${encodeURIComponent(roomName)}&name=${encodeURIComponent(name)}`);
        if (!res.ok) throw new Error(`connect failed: ${res.status}`);
        details = await res.json();
      } catch (err) {
        setStatus(`failed to get token: ${err.message}`, true);
        joinBtn.disabled = false;
        return;
      }

      room = new Room();

      room.on(RoomEvent.ParticipantConnected, (participant) => {
        ensureTile(participant.identity, participant.name || participant.identity);
      });
      room.on(RoomEvent.TrackSubscribed, (track, _pub, participant) => {
        attachTrack(track, participant.identity, participant.name || participant.identity);
      });
      room.on(RoomEvent.TrackUnsubscribed, (track) => {
        track.detach().forEach((el) => el.remove());
      });
      room.on(RoomEvent.ParticipantDisconnected, (participant) => {
        removeParticipantTile(participant.identity);
      });
      room.on(RoomEvent.Disconnected, () => {
        setStatus('disconnected');
        joinBtn.disabled = false;
        leaveBtn.disabled = true;
        grid.innerHTML = '';
      });

      setStatus('connecting to LiveKit...');
      try {
        await room.connect(details.serverUrl, details.participantToken);
      } catch (err) {
        setStatus(`connect failed: ${err.message}`, true);
        joinBtn.disabled = false;
        return;
      }

      try {
        await room.localParticipant.setCameraEnabled(true);
        await room.localParticipant.setMicrophoneEnabled(true);
      } catch (err) {
        setStatus(
          `connected, but could not access camera/mic: ${err.message}. ` +
            'This page must be loaded over https (or from localhost) for the browser to grant camera access at all — check the address bar.',
          true,
        );
        leaveBtn.disabled = false;
        return;
      }

      for (const pub of room.localParticipant.videoTrackPublications.values()) {
        if (pub.track) attachTrack(pub.track, room.localParticipant.identity, `${name} (you)`);
      }

      setStatus(`connected as ${details.participantName} to room "${details.roomName}"`);
      leaveBtn.disabled = false;
      refreshRoomList();
    }

    async function leave() {
      await room?.disconnect();
      room = undefined;
    }

    joinBtn.addEventListener('click', join);
    leaveBtn.addEventListener('click', leave);
    window.addEventListener('beforeunload', () => {
      room?.disconnect();
    });

    startRoomPolling();
  </script>
</body>
</html>
