log_level: info
api_key: devkey
api_secret: secret
# Docker container reaching the natively-run livekit-server + redis on the host. On macOS/Windows
# Docker Desktop resolves this automatically; on Linux use the host's real LAN/bridge IP instead.
ws_url: ws://host.docker.internal:7880
insecure: true
redis:
  address: host.docker.internal:6379
